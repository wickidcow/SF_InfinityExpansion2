# InfinityExpansion2 - Grower Machine Settings
#
# This file is intentionally separate from config.yml.
# Updating or changing IE2 versions will not overwrite an existing copy of this file.
# Missing settings always fall back to IE2's built-in defaults.
#
# Changes require a server restart.
#
# Tier settings:
#   energy-per-tick  - Energy consumed while the machine has a valid input.
#   output-interval  - Production interval in ticks.
#
# Recipe settings:
#   enabled          - Set false to disable that input.
#   outputs          - Amount produced for each output material.
#                      Set an output amount to 0 to remove only that output.
#                      Extra vanilla output materials may also be added here.
#
# To add an entirely new vanilla recipe, use custom-recipes with Bukkit Material names.
# Custom recipes are disabled unless enabled: true is present.

schema-version: 1

virtual-farm:
  tiers:
    tier-1:
      energy-per-tick: 18
      output-interval: 300
    tier-2:
      energy-per-tick: 90
      output-interval: 60
    tier-3:
