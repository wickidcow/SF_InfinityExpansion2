# Slimefun Legacy modern Mob Simulation defaults.
# This file is intentionally separate from mob-simulation.yml so existing customized
# servers receive new cards without their historical config being overwritten.
# Historical definitions override the same modern card ID even when enabled: false.
# drop-mode: random-one selects exactly one configured drop per production cycle.
# Optional potion metadata on potion-capable drops uses Bukkit PotionType names.
# Guide categories: All Mobs, Passive, Neutral, Hostile, and Boss Mobs.
# Set mob-simulation.guide.sort-order in config.yml to alphabetical (default)
# or config (alias: yaml) to follow historical entries, then non-overridden entries here.
# All never groups by type. Each type list preserves its order from the combined list.
# In config mode, unconfigured addon cards follow in stable card-ID order.
# Explicit textures, names, and colors are always preserved.
# Bundled defaults, or cards without texture: passive = iron, neutral = copper,
# hostile = diamond, boss = netherite chestplate.
# Optional guide-group: passive|neutral|hostile|boss overrides the category.
# Show or hide each selector with mob-simulation.guide.categories in config.yml.
# Restart the server after changing settings. See docs/SMARTSPAWNER_CARDS.md.

