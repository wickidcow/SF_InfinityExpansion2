# Slimefun Legacy modern Mob Simulation defaults.
# This file is intentionally separate from mob-simulation.yml so existing customized
# servers receive new cards without their historical config being overwritten.
# Define the same card id in mob-simulation.yml to override one of these defaults.
# drop-mode: random-one selects exactly one configured drop per production cycle.

goat:
  enabled: true
  name: "Goat"
  texture: GOAT_SPAWN_EGG
  energy: 300
  experience: 2
  drop-mode: random-one
  drops:
    - item: GOAT_HORN
      instrument: ponder_goat_horn
      chance: 1
    - item: GOAT_HORN
      instrument: sing_goat_horn
      chance: 1
    - item: GOAT_HORN
      instrument: seek_goat_horn
      chance: 1
    - item: GOAT_HORN
      instrument: feel_goat_horn
      chance: 1
    - item: GOAT_HORN
      instrument: admire_goat_horn
      chance: 1
    - item: GOAT_HORN
      instrument: call_goat_horn
      chance: 1
    - item: GOAT_HORN
      instrument: yearn_goat_horn
      chance: 1
    - item: GOAT_HORN
      instrument: dream_goat_horn
      chance: 1
  recipe:
    pattern:
      - "WHW"
      - "MXM"
      - "WHW"
    ingredient:
      W:
        item: WHITE_WOOL
        amount: 64
      H:
        item: GOAT_HORN
        amount: 1
      M:
        item: MILK_BUCKET
        amount: 1

