name: IE2 repair source snapshot
on:
  push:
    branches: [security/player-withdrawal-conservation-20261018]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Export exact tracked source
        run: |
          git rev-parse HEAD > source-head.txt
          git archive --format=tar HEAD > ie2-source.tar
          sha256sum ie2-source.tar > source-sha256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ie2-repair-source-snapshot
          path: |
            ie2-source.tar
            source-head.txt
            source-sha256.txt
          retention-days: 1
