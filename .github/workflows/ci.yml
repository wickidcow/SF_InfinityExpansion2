name: Build IE2 Compatibility Fork

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this validated versioned release'
        required: true
        type: boolean
        default: false
      confirm_version:
        description: 'Type the exact VERSION when publish=true'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  VERSION: "2.0.17"
  OUTPUT_NAME: "SF_InfinityExpansion2.0.17.jar"
  CORE_HEAD: a538adddaf58e2f219f383eb2be9bed27da7bafc
  NETWORKS_HEAD: 80ef42b137b1cd0ff4482ab2f02254c6755f897d

jobs:
  compatibility:
    name: Paper compatibility / Slimefun Legacy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IE2
        uses: actions/checkout@v6
      - name: Checkout Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: ${{ env.CORE_HEAD }}
          path: .deps/Slimefun-Legacy
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Publish Slimefun Legacy API locally
        working-directory: .deps/Slimefun-Legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=ALBION-SNAPSHOT --no-daemon
      - name: Regression-test Java 21 distribution gate
        run: python3 -m unittest discover -s scripts -p 'test_verify_java21_distribution.py' -v
      - name: Verify canonical release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          test "$OUTPUT_NAME" = "SF_InfinityExpansion${VERSION}.jar"
          grep -Fq 'archiveFileName.set("SF_InfinityExpansion${project.version}.jar")' build.gradle.kts
          if printf '%s\n%s\n' "$VERSION" "$OUTPUT_NAME" | grep -Eiq '(legacy|english|snapshot)'; then exit 1; fi
      - name: Regression-test production compiler deprecation allowlist
        run: python3 -m unittest discover -s scripts -p 'test_verify_owned_deprecations.py' -v
      - name: Verify Paper 1.21.11 baseline compilation and known ABI diagnostics
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean compileJava compileKotlin --stacktrace --console=plain -PpaperApiVersion=1.21.11-R0.1-SNAPSHOT -PtargetJvm=21 -PbuildVersion=2.0.17 -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT 2>&1 | tee baseline-compile.log
          python3 scripts/verify_owned_deprecations.py baseline-compile.log
      - name: Retain compiler deprecation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ie2-baseline-compiler-diagnostics
          path: baseline-compile.log
          if-no-files-found: warn
      - name: Verify Paper 26.2 compilation
        run: ./gradlew clean compileJava compileKotlin --stacktrace --console=plain -PpaperApiVersion=26.2.build.+ -PtargetJvm=25 -PbuildVersion=2.0.17 -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT
      - name: Verify Paper 26.3 stable compilation
        run: ./gradlew clean compileJava compileKotlin --stacktrace --console=plain -PpaperApiVersion=26.3.build.+ -PtargetJvm=25 -PbuildVersion=2.0.17 -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT
      - name: Build universal Java 21 release JAR
        run: ./gradlew clean build --stacktrace --console=plain -PpaperApiVersion=1.21.11-R0.1-SNAPSHOT -PtargetJvm=21 -PbuildVersion=2.0.17 -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT
      - name: Require completed new regression suites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name, minimum in {'ModernTextTest': 21, 'GameplayEventCompatibilityTest': 10}.items():
              reports = list(Path('build/test-results/test').glob('TEST-*.' + name + '.xml'))
              if len(reports) != 1:
                  raise SystemExit('Missing required regression suite: ' + name)
              suite = ET.parse(reports[0]).getroot()
              if int(suite.get('tests', '0')) < minimum or any(int(suite.get(k, '0')) for k in ('failures', 'errors', 'skipped')):
                  raise SystemExit('Required regression suite did not pass: ' + name)
          PYTEST
      - name: Stage exact native runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-deps
          CORE_JAR=$(find .deps/Slimefun-Legacy/build/libs -maxdepth 1 -name 'Slimefun-*.jar' ! -name '*sources*' | head -n 1)
          test -s "$CORE_JAR"
          cp "$CORE_JAR" native-deps/Slimefun-native-core.jar
          for NAME in kotlin-stdlib kotlin-reflect; do
            FILE=$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/$NAME/2.3.21" -name "$NAME-2.3.21.jar" | head -n 1)
            test -s "$FILE"
            cp "$FILE" "native-deps/$NAME-2.3.21.jar"
          done
          (cd native-deps && sha256sum *.jar > SHA256SUMS)
      - name: Retain exact native runtime dependencies
        uses: actions/upload-artifact@v7
        with:
          name: ie2-native-runtime-dependencies
          path: native-deps/*
          retention-days: 14
          if-no-files-found: error
      - name: Retain regression test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ie2-project-test-reports
          path: build/test-results/test/TEST-*.xml
          retention-days: 14
          if-no-files-found: warn
      - name: Verify and stage canonical shaded JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/${OUTPUT_NAME}"
          test -s "$JAR"
          test "$(find build/libs -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 1
          python3 scripts/verify_java21_distribution.py "$JAR"
          jar tf "$JAR" | grep -Fxq 'plugin.yml'
          jar tf "$JAR" | grep -Fxq 'mob-simulation-modern.yml'
          jar tf "$JAR" | grep -Fxq 'net/guizhanss/infinityexpansion2/libs/guizhanlib/slimefun/addon/AbstractAddon.class'
          if jar tf "$JAR" | grep -q '^net/guizhanss/guizhanlib/'; then
            echo 'Unrelocated GuizhanLib classes detected in distributable JAR.' >&2
            exit 1
          fi
          javap -classpath "$JAR" net.guizhanss.infinityexpansion2.InfinityExpansion2 | grep -Fq 'extends net.guizhanss.infinityexpansion2.libs.guizhanlib.slimefun.addon.AbstractAddon'
          PLUGIN_VERSION=$(unzip -p "$JAR" plugin.yml | awk -F': *' '/^version:/ {gsub(/["'"'"']/,"",$2); print $2; exit}')
          test "$PLUGIN_VERSION" = "$VERSION"
          if printf '%s\n' "$PLUGIN_VERSION" | grep -Eiq '(legacy|english|snapshot)'; then exit 1; fi
          mkdir -p dist
          cp "$JAR" "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Upload canonical raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

  source-safety:
    name: Migration and transport safety checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IE2
        uses: actions/checkout@v6
      - name: Verify native SQLite encoding and loss-detection contracts
        run: python3 -m unittest discover -s scripts/runtime/release -p 'test_*.py' -v
      - name: Checkout Slimefun Legacy transport contract
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: ${{ env.CORE_HEAD }}
          path: .deps/Slimefun-Legacy
      - name: Checkout Networks Expansion transport contract
        uses: actions/checkout@v6
        with:
          repository: wickidcow/SF_NetworksExp
          ref: ${{ env.NETWORKS_HEAD }}
          path: .deps/SF_NetworksExp
      - name: Verify migration, mob simulation, and transport invariants
        run: |
          python3 scripts/verify_legacy_migration.py
          python3 scripts/verify_doctor_bridge_safety.py
          python3 scripts/verify_mob_sim_drop_ranges.py
          python3 scripts/verify_mob_sim_input_filtering.py
          python3 scripts/verify_mob_sim_modern_cards.py
          python3 scripts/verify_transport_contracts.py --slimefun .deps/Slimefun-Legacy --networks .deps/SF_NetworksExp

  native-runtime:
    name: Native Paper ${{ matrix.paper }} / Java ${{ matrix.java }}
    needs: [compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - paper: '1.21.11'
            java: '21'
          - paper: '26.3'
            java: '25'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Download exact tested addon
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: native-input
          skip-decompress: true
      - name: Download exact core and Kotlin dependencies
        uses: actions/download-artifact@v8
        with:
          name: ie2-native-runtime-dependencies
          path: native-deps
      - name: Verify runtime inputs
        run: |
          set -euo pipefail
          (cd native-deps && sha256sum -c SHA256SUMS)
          test -s "native-input/${OUTPUT_NAME}"
      - name: Prepare checksum-verified official stable Paper
        run: python3 scripts/runtime/release/prepare_paper.py --version "${{ matrix.paper }}" --directory .native/paper-cache --java-home "$JAVA_HOME"
      - name: Native item tests and two live database restart phases
        run: |
          python3 scripts/runtime/release/run.py \
            --runtime .native/server --paper-source .native/paper-cache \
            --core native-deps/Slimefun-native-core.jar --ie2 "native-input/${OUTPUT_NAME}" \
            --java-home "$JAVA_HOME" \
            --kotlin-stdlib native-deps/kotlin-stdlib-2.3.21.jar \
            --kotlin-reflect native-deps/kotlin-reflect-2.3.21.jar --timeout 300
      - name: Retain native runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ie2-native-${{ matrix.paper }}-java${{ matrix.java }}
          include-hidden-files: true
          path: |
            .native/paper-cache/official-build.json
            .native/paper-cache/bootstrap.log
            .native/server/*.log
            .native/server/*.json
            .native/server/*results.txt
            .native/server/plugins/NativeModernizationProbe/results-*.txt
            .native/server/plugins/NativeMobCardRefreshProbe/results.txt
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish validated immutable IE2 release
    needs: [compatibility, source-safety, native-runtime]
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the validated release notes
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download validated canonical JAR
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist
          # The raw JAR is itself a ZIP; retain its original bytes for publication.
          skip-decompress: true

      - name: Validate explicit release publication request
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_VERSION" = "$VERSION" || {
            echo "Refusing publication: confirm_version must exactly match VERSION ($VERSION)." >&2
            exit 1
          }
          JAR="dist/${OUTPUT_NAME}"
          test -s "$JAR"
          test -s "docs/releases/${VERSION}.md"
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing publication: release $TAG already exists." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Refusing publication: tag $TAG already exists." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish canonical raw JAR release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release_state.outputs.tag }}"
          test -n "$TAG"
          JAR="dist/${OUTPUT_NAME}"
          test -s "$JAR"
          gh release create "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SF_InfinityExpansion ${VERSION}" --notes-file "docs/releases/${VERSION}.md"

