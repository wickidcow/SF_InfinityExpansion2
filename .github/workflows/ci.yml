name: Build IE2 Compatibility Fork

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this validated versioned release'
        required: true
        type: boolean
        default: false
      confirm_version:
        description: 'Type the exact VERSION when publish=true'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  VERSION: "2.0.16"
  OUTPUT_NAME: "SF_InfinityExpansion2.0.16.jar"
  CORE_HEAD: a538adddaf58e2f219f383eb2be9bed27da7bafc
  NETWORKS_HEAD: 80ef42b137b1cd0ff4482ab2f02254c6755f897d

jobs:
  compatibility:
    name: Paper compatibility / Slimefun Legacy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IE2
        uses: actions/checkout@v6
      - name: Checkout Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: ${{ env.CORE_HEAD }}
          path: .deps/Slimefun-Legacy
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Publish Slimefun Legacy API locally
        working-directory: .deps/Slimefun-Legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=ALBION-SNAPSHOT --no-daemon
      - name: Verify canonical release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          test "$OUTPUT_NAME" = "SF_InfinityExpansion${VERSION}.jar"
          grep -Fq 'archiveFileName.set("SF_InfinityExpansion${project.version}.jar")' build.gradle.kts
          if printf '%s\n%s\n' "$VERSION" "$OUTPUT_NAME" | grep -Eiq '(legacy|english|snapshot)'; then exit 1; fi
      - name: Verify Paper 1.21.11 baseline compilation
        run: ./gradlew clean compileJava compileKotlin --stacktrace --console=plain -PpaperApiVersion=1.21.11-R0.1-SNAPSHOT -PtargetJvm=21 -PbuildVersion=2.0.16 -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT
      - name: Verify Paper 26.2 compilation
        run: ./gradlew clean compileJava compileKotlin --stacktrace --console=plain -PpaperApiVersion=26.2.build.+ -PtargetJvm=25 -PbuildVersion=2.0.16 -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT
      - name: Verify Paper 26.3 stable compilation
        run: ./gradlew clean compileJava compileKotlin --stacktrace --console=plain -PpaperApiVersion=26.3.build.+ -PtargetJvm=25 -PbuildVersion=2.0.16 -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT
      - name: Build universal Java 21 release JAR
        run: ./gradlew clean build --stacktrace --console=plain -PpaperApiVersion=1.21.11-R0.1-SNAPSHOT -PtargetJvm=21 -PbuildVersion=2.0.16 -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT
      - name: Retain regression test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ie2-project-test-reports
          path: build/test-results/test/TEST-*.xml
          retention-days: 14
          if-no-files-found: warn
      - name: Verify and stage canonical shaded JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/${OUTPUT_NAME}"
          test -s "$JAR"
          test "$(find build/libs -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 1
          python3 - <<'PY'
          import os, struct, zipfile
          jar=os.environ['OUTPUT_NAME']
          path=f'build/libs/{jar}'
          majors=set()
          with zipfile.ZipFile(path) as z:
              for name in z.namelist():
                  if name.endswith('.class'):
                      data=z.read(name)[:8]
                      if len(data)==8 and data[:4]==b'\xca\xfe\xba\xbe':
                          majors.add(struct.unpack('>H', data[6:8])[0])
          if 65 not in majors or any(m > 65 for m in majors):
              raise SystemExit(f'Expected only Java 21-or-older plugin classes; saw {sorted(majors)}')
          print('Verified Java 21-compatible plugin classes.')
          PY
          jar tf "$JAR" | grep -Fxq 'plugin.yml'
          jar tf "$JAR" | grep -Fxq 'mob-simulation-modern.yml'
          jar tf "$JAR" | grep -Fxq 'net/guizhanss/infinityexpansion2/libs/guizhanlib/slimefun/addon/AbstractAddon.class'
          if jar tf "$JAR" | grep -q '^net/guizhanss/guizhanlib/'; then
            echo 'Unrelocated GuizhanLib classes detected in distributable JAR.' >&2
            exit 1
          fi
          javap -classpath "$JAR" net.guizhanss.infinityexpansion2.InfinityExpansion2 | grep -Fq 'extends net.guizhanss.infinityexpansion2.libs.guizhanlib.slimefun.addon.AbstractAddon'
          PLUGIN_VERSION=$(unzip -p "$JAR" plugin.yml | awk -F': *' '/^version:/ {gsub(/["'"'"']/,"",$2); print $2; exit}')
          test "$PLUGIN_VERSION" = "$VERSION"
          if printf '%s\n' "$PLUGIN_VERSION" | grep -Eiq '(legacy|english|snapshot)'; then exit 1; fi
          mkdir -p dist
          cp "$JAR" "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Upload canonical raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

  source-safety:
    name: Migration and transport safety checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IE2
        uses: actions/checkout@v6
      - name: Checkout Slimefun Legacy transport contract
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: ${{ env.CORE_HEAD }}
          path: .deps/Slimefun-Legacy
      - name: Checkout Networks Expansion transport contract
        uses: actions/checkout@v6
        with:
          repository: wickidcow/SF_NetworksExp
          ref: ${{ env.NETWORKS_HEAD }}
          path: .deps/SF_NetworksExp
      - name: Verify migration, mob simulation, and transport invariants
        run: |
          python3 scripts/verify_legacy_migration.py
          python3 scripts/verify_doctor_bridge_safety.py
          python3 scripts/verify_mob_sim_drop_ranges.py
          python3 scripts/verify_mob_sim_input_filtering.py
          python3 scripts/verify_mob_sim_modern_cards.py
          python3 scripts/verify_transport_contracts.py --slimefun .deps/Slimefun-Legacy --networks .deps/SF_NetworksExp

  publish:
    name: Publish validated immutable IE2 release
    needs: [compatibility, source-safety]
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the validated release notes
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download validated canonical JAR
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist
          # The raw JAR is itself a ZIP; retain its original bytes for publication.
          skip-decompress: true

      - name: Validate explicit release publication request
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_VERSION" = "$VERSION" || {
            echo "Refusing publication: confirm_version must exactly match VERSION ($VERSION)." >&2
            exit 1
          }
          JAR="dist/${OUTPUT_NAME}"
          test -s "$JAR"
          test -s "docs/releases/${VERSION}.md"
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing publication: release $TAG already exists." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Refusing publication: tag $TAG already exists." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish canonical raw JAR release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release_state.outputs.tag }}"
          test -n "$TAG"
          JAR="dist/${OUTPUT_NAME}"
          test -s "$JAR"
          gh release create "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SF_InfinityExpansion ${VERSION}" --notes-file "docs/releases/${VERSION}.md"

  # Exact-source one-time publication, granted by the repository owner.
  # The publish flag in workflow_dispatch is unchanged; this job runs once
  # on the approved workflow-only merge, then becomes inert.
  publish_reviewed_source_once:
    name: Publish reviewed immutable IE2 2.0.16
    needs: [compatibility, source-safety]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.before == 'a9b105e5cf3e8c69b3edb135c615eb3710f72158'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout workflow-only release approval
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Download the validated Java 21 JAR
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist
          skip-decompress: true
      - name: Verify source, immutable JAR and absent release before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APPROVED=a9b105e5cf3e8c69b3edb135c615eb3710f72158
          JAR=dist/SF_InfinityExpansion2.0.16.jar
          test "$(git rev-parse HEAD^)" = "$APPROVED"
          test "$(git diff --name-only "$APPROVED" "$GITHUB_SHA")" = '.github/workflows/ci.yml'
          test -s "$JAR"
          test "$(stat -c %s "$JAR")" -eq 1722317
          printf '%s  %s\n' 0ee8037249f25e912d26b510f838869fd892ccde469eb32cbd980e3a66010ac3 "$JAR" | sha256sum --check --strict
          test -s docs/releases/2.0.16.md
          unzip -p "$JAR" plugin.yml | grep -Eq '^version: ["\x27]?2\.0\.16["\x27]?$'
          if gh release view v2.0.16 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing release' >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v2.0.16 >/dev/null 2>&1; then
            echo 'Refusing to replace an existing tag' >&2
            exit 1
          fi
          gh release create v2.0.16 "$JAR" --repo "$GITHUB_REPOSITORY" --target "$APPROVED" --title 'SF_InfinityExpansion 2.0.16' --notes-file docs/releases/2.0.16.md
          echo 'Published approved IE2 source and exact CI-validated JAR; no plugin files changed.' >> "$GITHUB_STEP_SUMMARY"
