name: Build IE2 Legacy Fork

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "2.0.6"
  OUTPUT_NAME: "SF_InfinityExpansion2.0.6.jar"

jobs:
  paper-26-2:
    name: Paper 26.2 / Java 25 / Slimefun Legacy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IE2
        uses: actions/checkout@v6
      - name: Checkout Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .deps/Slimefun-Legacy
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Publish Slimefun Legacy API locally
        working-directory: .deps/Slimefun-Legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=ALBION-SNAPSHOT --no-daemon
      - name: Build Paper 26.2 target
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean shadowJar --stacktrace --console=plain --warning-mode=all \
            -PpaperApiVersion=26.2.build.+ \
            -PbuildVersion="${LEGACY_ARTIFACT_VERSION}" \
            -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT \
            2>&1 | tee build-paper-26.2.log
      - name: Verify Java 21 plugin bytecode
        run: |
          python3 - <<'PY'
          import glob, struct, zipfile
          jars = glob.glob('build/libs/SF_IE2Legacy*.jar')
          if not jars:
              raise SystemExit('No IE2 Legacy jar produced')
          majors = set()
          with zipfile.ZipFile(jars[0]) as z:
              for name in z.namelist():
                  if name.endswith('.class'):
                      data = z.read(name)[:8]
                      if len(data) == 8 and data[:4] == b'\xca\xfe\xba\xbe':
                          majors.add(struct.unpack('>H', data[6:8])[0])
          if 65 not in majors:
              raise SystemExit(f'Expected Java 21 class major 65; saw {sorted(majors)}')
          print('Verified Java 21-compatible plugin classes.')
          PY
      - name: Stage versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'SF_IE2Legacy*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" "dist/${OUTPUT_NAME}"
          test -s "dist/${OUTPUT_NAME}"
          jar tf "dist/${OUTPUT_NAME}" | grep -Fxq 'plugin.yml'
          jar tf "dist/${OUTPUT_NAME}" | grep -Fxq 'mob-simulation-modern.yml'
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${LEGACY_ARTIFACT_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          NOTES="v2.0.6 hardens IE2 automation: empty Storage Units can be seeded through Slimefun Legacy Cargo, Tree/Flower Growers and Virtual Farm now stop losslessly when outputs are full, Quarry and Geo Quarry now preserve generated resources and power under backpressure, and CI verifies transport contracts against Slimefun Legacy Cargo and Networks Expansion. Built on Paper 26.2 / Java 25 directly against Slimefun Legacy while retaining Java 21 addon bytecode."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "SF_InfinityExpansion2 $TAG" --notes "$NOTES"
          fi

  source-safety:
    name: Migration and transport safety checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IE2
        uses: actions/checkout@v6
      - name: Checkout Slimefun Legacy transport contract
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .deps/Slimefun-Legacy
      - name: Checkout Networks Expansion transport contract
        uses: actions/checkout@v6
        with:
          repository: wickidcow/SF_NetworksExp
          ref: master
          path: .deps/SF_NetworksExp
      - name: Verify migration and transport invariants
        run: |
          python3 scripts/verify_legacy_migration.py
          python3 scripts/verify_doctor_bridge_safety.py .
          python3 scripts/verify_transport_contracts.py \
            --slimefun .deps/Slimefun-Legacy \
            --networks .deps/SF_NetworksExp
