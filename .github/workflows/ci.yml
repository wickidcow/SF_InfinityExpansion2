name: Build IE2 Legacy Fork

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "2.0.7"
  OUTPUT_NAME: "SF_InfinityExpansion22.0.7.jar"

jobs:
  compatibility:
    name: Paper compatibility / Slimefun Legacy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IE2
        uses: actions/checkout@v6
      - name: Checkout Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .deps/Slimefun-Legacy
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Publish Slimefun Legacy API locally
        working-directory: .deps/Slimefun-Legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=ALBION-SNAPSHOT --no-daemon

      - name: Verify Paper 1.21.11 baseline compilation
        run: >-
          ./gradlew clean compileJava compileKotlin --stacktrace --console=plain
          -PpaperApiVersion=1.21.11-R0.1-SNAPSHOT
          -PtargetJvm=21
          -PbuildVersion=2.0.7
          -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT

      - name: Verify Paper 26.2 compilation
        run: >-
          ./gradlew clean compileJava compileKotlin --stacktrace --console=plain
          -PpaperApiVersion=26.2.build.+
          -PtargetJvm=25
          -PbuildVersion=2.0.7
          -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT

      - name: Verify Paper 26.3 alpha compilation
        run: >-
          ./gradlew clean compileJava compileKotlin --stacktrace --console=plain
          -PpaperApiVersion=26.3-rc-3.build.1-alpha
          -PtargetJvm=25
          -PbuildVersion=2.0.7
          -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT

      - name: Build universal Java 21 release JAR
        run: >-
          ./gradlew clean shadowJar --stacktrace --console=plain
          -PpaperApiVersion=1.21.11-R0.1-SNAPSHOT
          -PtargetJvm=21
          -PbuildVersion=2.0.7
          -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT

      - name: Verify and stage release JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/${OUTPUT_NAME}"
          test -s "$JAR"
          python3 - <<'PY'
          import struct, zipfile
          jar='build/libs/SF_InfinityExpansion22.0.7.jar'
          majors=set()
          with zipfile.ZipFile(jar) as z:
              for name in z.namelist():
                  if name.endswith('.class'):
                      data=z.read(name)[:8]
                      if len(data)==8 and data[:4]==b'\xca\xfe\xba\xbe':
                          majors.add(struct.unpack('>H', data[6:8])[0])
          if 65 not in majors or any(m > 65 for m in majors):
              raise SystemExit(f'Expected only Java 21-or-older plugin classes; saw {sorted(majors)}')
          print('Verified Java 21-compatible plugin classes.')
          PY
          jar tf "$JAR" | grep -Fxq 'plugin.yml'
          jar tf "$JAR" | grep -Fxq 'mob-simulation-modern.yml'
          mkdir -p dist
          cp "$JAR" "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"

      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

      - name: Publish raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${LEGACY_ARTIFACT_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          NOTES="InfinityExpansion2 2.0.7 adds Paper 26.3 alpha compatibility validation while keeping Paper 26.2 as the primary production target and preserving the Java 21 universal addon baseline. The public build version is now explicit instead of timestamp-generated, and the artifact follows the standard ${OUTPUT_NAME} naming convention."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "SF_InfinityExpansion2 $TAG" --notes "$NOTES"
          fi

  source-safety:
    name: Migration and transport safety checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IE2
        uses: actions/checkout@v6
      - name: Checkout Slimefun Legacy transport contract
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .deps/Slimefun-Legacy
      - name: Checkout Networks Expansion transport contract
        uses: actions/checkout@v6
        with:
          repository: wickidcow/SF_NetworksExp
          ref: master
          path: .deps/SF_NetworksExp
      - name: Verify migration and transport invariants
        run: |
          python3 scripts/verify_legacy_migration.py
          python3 scripts/verify_doctor_bridge_safety.py
          python3 scripts/verify_transport_contracts.py \
            --slimefun .deps/Slimefun-Legacy \
            --networks .deps/SF_NetworksExp
