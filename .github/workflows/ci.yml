name: Build IE2 Compatibility Fork

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "2.0.7"
  OUTPUT_NAME: "SF_InfinityExpansion2.0.7.jar"

jobs:
  compatibility:
    name: Paper compatibility / Slimefun Legacy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IE2
        uses: actions/checkout@v6
      - name: Checkout Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .deps/Slimefun-Legacy
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Publish Slimefun Legacy API locally
        working-directory: .deps/Slimefun-Legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=ALBION-SNAPSHOT --no-daemon
      - name: Verify canonical release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          test "$OUTPUT_NAME" = "SF_InfinityExpansion${VERSION}.jar"
          grep -Fq 'archiveFileName.set("SF_InfinityExpansion${project.version}.jar")' build.gradle.kts
          if printf '%s\n%s\n' "$VERSION" "$OUTPUT_NAME" | grep -Eiq '(legacy|english|snapshot)'; then exit 1; fi
      - name: Verify Paper 1.21.11 baseline compilation
        run: ./gradlew clean compileJava compileKotlin --stacktrace --console=plain -PpaperApiVersion=1.21.11-R0.1-SNAPSHOT -PtargetJvm=21 -PbuildVersion=2.0.7 -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT
      - name: Verify Paper 26.2 compilation
        run: ./gradlew clean compileJava compileKotlin --stacktrace --console=plain -PpaperApiVersion=26.2.build.+ -PtargetJvm=25 -PbuildVersion=2.0.7 -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT
      - name: Verify Paper 26.3 alpha compilation
        run: ./gradlew clean compileJava compileKotlin --stacktrace --console=plain -PpaperApiVersion=26.3-rc-3.build.1-alpha -PtargetJvm=25 -PbuildVersion=2.0.7 -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT
      - name: Build universal Java 21 release JAR
        run: ./gradlew clean build --stacktrace --console=plain -PpaperApiVersion=1.21.11-R0.1-SNAPSHOT -PtargetJvm=21 -PbuildVersion=2.0.7 -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT
      - name: Verify and stage canonical shaded JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/${OUTPUT_NAME}"
          test -s "$JAR"
          test "$(find build/libs -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 1
          python3 - <<'PY'
          import os, struct, zipfile
          jar=os.environ['OUTPUT_NAME']
          path=f'build/libs/{jar}'
          majors=set()
          with zipfile.ZipFile(path) as z:
              for name in z.namelist():
                  if name.endswith('.class'):
                      data=z.read(name)[:8]
                      if len(data)==8 and data[:4]==b'\xca\xfe\xba\xbe':
                          majors.add(struct.unpack('>H', data[6:8])[0])
          if 65 not in majors or any(m > 65 for m in majors):
              raise SystemExit(f'Expected only Java 21-or-older plugin classes; saw {sorted(majors)}')
          print('Verified Java 21-compatible plugin classes.')
          PY
          jar tf "$JAR" | grep -Fxq 'plugin.yml'
          jar tf "$JAR" | grep -Fxq 'mob-simulation-modern.yml'
          jar tf "$JAR" | grep -Fxq 'net/guizhanss/infinityexpansion2/libs/guizhanlib/slimefun/addon/AbstractAddon.class'
          if jar tf "$JAR" | grep -q '^net/guizhanss/guizhanlib/'; then
            echo 'Unrelocated GuizhanLib classes detected in distributable JAR.' >&2
            exit 1
          fi
          javap -classpath "$JAR" net.guizhanss.infinityexpansion2.InfinityExpansion2 | grep -Fq 'extends net.guizhanss.infinityexpansion2.libs.guizhanlib.slimefun.addon.AbstractAddon'
          PLUGIN_VERSION=$(unzip -p "$JAR" plugin.yml | awk -F': *' '/^version:/ {gsub(/["'"'"']/,"",$2); print $2; exit}')
          test "$PLUGIN_VERSION" = "$VERSION"
          if printf '%s\n' "$PLUGIN_VERSION" | grep -Eiq '(legacy|english|snapshot)'; then exit 1; fi
          mkdir -p dist
          cp "$JAR" "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Upload canonical raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish canonical raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r OLD; do
              if [[ "$OLD" == *.jar && "$OLD" != "$OUTPUT_NAME" ]]; then gh release delete-asset "$TAG" "$OLD" --repo "$GITHUB_REPOSITORY" -y; fi
            done < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SF_InfinityExpansion ${VERSION}" --notes "InfinityExpansion ${VERSION}: canonical ${OUTPUT_NAME} release."
          fi

  source-safety:
    name: Migration and transport safety checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IE2
        uses: actions/checkout@v6
      - name: Checkout Slimefun Legacy transport contract
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .deps/Slimefun-Legacy
      - name: Checkout Networks Expansion transport contract
        uses: actions/checkout@v6
        with:
          repository: wickidcow/SF_NetworksExp
          ref: master
          path: .deps/SF_NetworksExp
      - name: Verify migration and transport invariants
        run: |
          python3 scripts/verify_legacy_migration.py
          python3 scripts/verify_doctor_bridge_safety.py
          python3 scripts/verify_transport_contracts.py --slimefun .deps/Slimefun-Legacy --networks .deps/SF_NetworksExp
