name: Storage Withdrawal Preservation Validation
on:
  push:
    branches: ['audit/withdrawal-preservation-20261002']
    paths: ['.audit/withdrawal/**', '.github/workflows/withdrawal-preservation-validation.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: 82427167200e1b349b53c8c81f2373a5b36e340f
          path: .deps/Slimefun-Legacy
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: wickidcow/SF_NetworksExp
          ref: master
          path: .deps/SF_NetworksExp
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Publish only the exact released core API locally
        run: |
          set -euo pipefail
          mkdir -p evidence runtime-inputs
          git rev-parse HEAD > evidence/audit-source.txt
          git -C .deps/Slimefun-Legacy rev-parse HEAD > evidence/core-source.txt
          git -C .deps/SF_NetworksExp rev-parse HEAD > evidence/networks-source.txt
          chmod +x gradlew .deps/Slimefun-Legacy/gradlew
          (cd .deps/Slimefun-Legacy && ./gradlew publishToMavenLocal -PprojectVersion=ALBION-SNAPSHOT --no-daemon --no-configuration-cache) > evidence/core-api-build.log 2>&1
      - name: Apply the scoped correction and prove the old partial-accounting failure
        run: |
          set -euo pipefail
          python3 .audit/withdrawal/apply.py
          git diff --check
          FILE=src/main/java/net/guizhanss/infinityexpansion2/implementation/items/storage/StorageWithdrawal.java
          cp "$FILE" "$RUNNER_TEMP/StorageWithdrawal.corrected.java"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/net/guizhanss/infinityexpansion2/implementation/items/storage/StorageWithdrawal.java')
          text=p.read_text()
          start=text.index('        long remaining = 0;')
          end=text.index('        return accepted;',start)
          old='''        int accepted = leftovers.isEmpty() ? offered : 0;
                  if (accepted > 0) {
                      cache.setAmount(cache.getAmount() - accepted);
                  }
          '''
          p.write_text(text[:start]+old+text[end:])
          PY
          STATUS=0
          ./gradlew test --tests '*StorageWithdrawalTest' -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT --no-daemon --no-configuration-cache > evidence/original-test.log 2>&1 || STATUS=$?
          test "$STATUS" -ne 0
          mkdir -p evidence/original-tests
          cp build/test-results/test/TEST-*.xml evidence/original-tests/
          python3 - <<'PY'
          from pathlib import Path
          import json,xml.etree.ElementTree as ET
          files=list(Path('evidence/original-tests').glob('TEST-*.xml'))
          assert len(files)==1,files
          r=ET.parse(files[0]).getroot()
          counts={k:int(r.attrib[k]) for k in ['tests','failures','errors','skipped']}
          assert counts['tests']==18 and counts['failures']>0 and counts['errors']==counts['skipped']==0,counts
          case=next(c for c in r.findall('testcase') if c.attrib['name'].startswith('partiallyAcceptedStackIsDebitedExactlyOnce'))
          assert case.find('failure').attrib['type']=='org.opentest4j.AssertionFailedError'
          Path('evidence/original-counts.json').write_text(json.dumps(counts,indent=2)+'\n')
          print(counts)
          PY
          cp "$RUNNER_TEMP/StorageWithdrawal.corrected.java" "$FILE"
      - name: Run all retained source guards and the complete corrected project build
        run: |
          set -euo pipefail
          {
            python3 scripts/verify_legacy_migration.py
            python3 scripts/verify_doctor_bridge_safety.py
            python3 scripts/verify_mob_sim_drop_ranges.py
            python3 scripts/verify_mob_sim_input_filtering.py
            python3 scripts/verify_transport_contracts.py --slimefun .deps/Slimefun-Legacy --networks .deps/SF_NetworksExp
          } > evidence/source-invariants.log 2>&1
          ./gradlew clean build -PpaperApiVersion=1.21.11-R0.1-SNAPSHOT -PtargetJvm=21 -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT --no-daemon --no-build-cache --no-configuration-cache > evidence/corrected-build.log 2>&1
          mkdir -p evidence/corrected-tests
          cp build/test-results/test/TEST-*.xml evidence/corrected-tests/
          cp build/libs/SF_InfinityExpansion2.0.10.jar runtime-inputs/candidate.jar
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,xml.etree.ElementTree as ET,zipfile
          roots=[ET.parse(p).getroot() for p in Path('evidence/corrected-tests').glob('TEST-*.xml')]
          counts={k:sum(int(r.attrib[k]) for r in roots) for k in ['tests','failures','errors','skipped']}
          assert counts['tests']>=18 and counts['failures']==counts['errors']==counts['skipped']==0,counts
          regression=next(r for r in roots if r.attrib['name'].endswith('.StorageWithdrawalTest'))
          assert int(regression.attrib['tests'])==18
          p=Path('runtime-inputs/candidate.jar')
          with zipfile.ZipFile(p) as jar:
              assert jar.testzip() is None
              assert 'net/guizhanss/infinityexpansion2/implementation/items/storage/StorageWithdrawal.class' in jar.namelist()
              for name in jar.namelist():
                  assert not name.startswith(('org/junit/','org/mockbukkit/','audit/')),name
                  if name.endswith('.class') and not name.startswith('META-INF/versions/'):
                      data=jar.read(name)
                      assert data[:4]==b'\xca\xfe\xba\xbe' and int.from_bytes(data[6:8],'big')<=65 and int.from_bytes(data[4:6],'big')!=65535,name
          counts['jar_sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('evidence/corrected-counts.json').write_text(json.dumps(counts,indent=2)+'\n')
          print(counts)
          PY
      - name: Stage reviewed source objects without modifying refs or publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          names=['src/main/kotlin/net/guizhanss/infinityexpansion2/implementation/items/storage/StorageUnit.kt','src/main/java/net/guizhanss/infinityexpansion2/implementation/items/storage/StorageWithdrawal.java','src/test/java/net/guizhanss/infinityexpansion2/implementation/items/storage/StorageWithdrawalTest.java']
          records={}
          for name in names:
              data=Path(name).read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              response=subprocess.run(['gh','api','--method','POST','repos/wickidcow/SF_InfinityExpansion2/git/blobs','--input','-'],input=json.dumps(dict(content=data.decode(),encoding='utf-8')),text=True,capture_output=True,check=True)
              assert json.loads(response.stdout)['sha']==sha
              records[name]=sha
              target=Path('evidence/reviewed-source')/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          Path('evidence/reviewed-blobs.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
      - name: Preserve failed reports too
        if: always()
        run: |
          mkdir -p evidence/last-reports
          if test -d build/test-results/test; then cp build/test-results/test/TEST-*.xml evidence/last-reports/ || true; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storage-withdrawal-preservation-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: storage-withdrawal-runtime-inputs
          path: runtime-inputs/
          retention-days: 14
          if-no-files-found: error
