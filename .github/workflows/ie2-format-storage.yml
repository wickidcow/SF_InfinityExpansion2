name: One-shot IE2 StorageUnit formatting cleanup

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ie2-format-storage.yml'

permissions:
  contents: write

jobs:
  format-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Normalize patched StorageUnit method formatting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/kotlin/net/guizhanss/infinityexpansion2/implementation/items/storage/StorageUnit.kt')
          lines = path.read_text().splitlines()
          start = next((i for i, line in enumerate(lines) if line == '    override fun getInputSlots(menu: DirtyChestMenu, item: ItemStack): IntArray {'), None)
          tick = next((i for i, line in enumerate(lines) if line == 'private fun tick(b: Block) {'), None)
          if start is None:
              raise SystemExit('StorageUnit transport method not found.')
          if tick is None:
              if any(line == '    private fun tick(b: Block) {' for line in lines):
                  print('StorageUnit formatting is already normalized.')
              else:
                  raise SystemExit('StorageUnit tick method not found.')
          else:
              for i in range(start + 1, tick):
                  if lines[i]:
                      lines[i] = '    ' + lines[i]
              lines[tick] = '    ' + lines[tick]
              path.write_text('\n'.join(lines) + '\n')
              print('StorageUnit formatting normalized.')
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ie2-format-storage.yml
          git add src/main/kotlin/net/guizhanss/infinityexpansion2/implementation/items/storage/StorageUnit.kt
          git commit -m 'Normalize IE2 Storage Unit transport formatting'
          git push origin HEAD:master
