name: One-shot IE2 2.0.6 storage hardening

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ie2-hardening-206.yml'

permissions:
  contents: write

jobs:
  patch-storage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch empty Storage Unit cargo seeding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main/kotlin/net/guizhanss/infinityexpansion2/implementation/items/storage/StorageUnit.kt')
          text = path.read_text()
          marker = '!item.isBlacklisted() &&'
          if marker in text:
              print('Storage transport hardening is already present.')
          else:
              pattern = re.compile(
                  r'    override fun getInputSlots\(menu: DirtyChestMenu, item: ItemStack\): IntArray \{\n'
                  r'.*?'
                  r'\n    \}\n\n    private fun tick',
                  re.DOTALL,
              )
              replacement = '''    override fun getInputSlots(menu: DirtyChestMenu, item: ItemStack): IntArray {
              val cache = _caches[(menu as BlockMenu).position]
              return if (
                  cache != null &&
                  !item.isBlacklisted() &&
                  (cache.isEmpty() || (cache.matches(item) && isSimilar(item, menu.getItemInSlot(outputSlots[0]))))
              ) {
                  inputSlots
              } else {
                  intArrayOf()
              }
          }

          private fun tick'''
              updated, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected exactly one StorageUnit transport method, replaced {count}; refusing unsafe patch.')
              path.write_text(updated)
              print('Patched StorageUnit empty Cargo seeding safely.')
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ie2-hardening-206.yml
          git add src/main/kotlin/net/guizhanss/infinityexpansion2/implementation/items/storage/StorageUnit.kt
          git commit -m 'Fix empty IE2 Storage Unit Cargo seeding'
          git push origin HEAD:master
