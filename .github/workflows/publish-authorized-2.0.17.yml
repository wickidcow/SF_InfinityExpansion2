name: Publish authorized IE2 2.0.17

on:
  workflow_run:
    workflows: ['Build IE2 Compatibility Fork']
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-ie2-2.0.17
  cancel-in-progress: false

jobs:
  publish:
    # One explicitly authorized release only, never PR artifacts or arbitrary branch builds.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
      VERSION: '2.0.17'
      OUTPUT_NAME: SF_InfinityExpansion2.0.17.jar
    steps:
      - name: Verify this exact authorized merged release and its native gates
        id: authorized
        shell: bash
        run: |
          set -euo pipefail
          PR=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/51")
          if ! jq -e --arg sha "$SOURCE_SHA" '.merged == true and .base.ref == "master" and .head.ref == "release/ie2-modernization-20261029" and .merge_commit_sha == $sha' <<<"$PR" >/dev/null; then
            echo 'Not the exact authorized release merge; publication skipped.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}/jobs?per_page=100" > jobs.json
          python3 - <<'PY'
          import json
          jobs = json.load(open('jobs.json'))['jobs']
          required = ['Paper compatibility / Slimefun Legacy', 'Migration and transport safety checks',
                      'Native Paper 1.21.11 / Java 21', 'Native Paper 26.3 / Java 25']
          for name in required:
              matching = [job for job in jobs if job['name'] == name]
              if len(matching) != 1 or matching[0]['conclusion'] != 'success':
                  raise SystemExit('Required exact-run release gate did not pass: ' + name)
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}/artifacts?per_page=100" > artifacts.json
          DIGEST=$(jq -er --arg name "$OUTPUT_NAME" --arg sha "$SOURCE_SHA" '[.artifacts[] | select(.name == $name and .expired == false and .workflow_run.head_sha == $sha)] | if length == 1 then .[0].digest else error("Missing or ambiguous exact artifact") end' artifacts.json)
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${DIGEST#sha256:}" >> "$GITHUB_OUTPUT"
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Check out only the tested release notes
        if: steps.authorized.outputs.publish == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          path: tested-source
      - name: Download the exact successful run's raw JAR
        if: steps.authorized.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: SF_InfinityExpansion2.0.17.jar
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: dist
          skip-decompress: true
      - name: Verify digest and publish without replacing an existing release
        if: steps.authorized.outputs.publish == 'true'
        shell: bash
        env:
          EXPECTED_SHA256: ${{ steps.authorized.outputs.digest }}
        run: |
          set -euo pipefail
          JAR="dist/${OUTPUT_NAME}"
          echo "${EXPECTED_SHA256}  ${JAR}" | sha256sum -c -
          python3 - <<'PY'
          import os, re, zipfile
          with zipfile.ZipFile('dist/' + os.environ['OUTPUT_NAME']) as jar:
              if jar.testzip() is not None:
                  raise SystemExit('Corrupt JAR')
              descriptor = jar.read('plugin.yml').decode()
              version = re.search(r'^version:\s*[\"\']?([^\"\'\s]+)', descriptor, re.M)
              if version is None or version.group(1) != os.environ['VERSION']:
                  raise SystemExit('Packaged version does not match authorized release')
          PY
          NOTES="tested-source/docs/releases/${VERSION}.md"
          test -s "$NOTES"
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing release.' >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing tag.' >&2
            exit 1
          fi
          gh release create "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "SF_InfinityExpansion ${VERSION}" --notes-file "$NOTES"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,url,assets
