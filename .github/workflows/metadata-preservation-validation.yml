name: IE2 Legacy Metadata Preservation Validation

on:
  push:
    branches: ['work/legacy-metadata-preservation-validation']

permissions:
  contents: write

concurrency:
  group: ie2-metadata-preservation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: d600e077552baab2086a056d04b1cb0a6a9051a5
          path: .deps/Slimefun-Legacy
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: wickidcow/SF_NetworksExp
          ref: cda26048b792900dd3dd16c1f6ca0075ed8de07b
          path: .deps/SF_NetworksExp
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Apply the exact reviewed metadata-preservation change
        run: |
          python3 - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          raw = b''.join(Path(f'.audit/metadata-preservation.{i}').read_bytes() for i in range(3))
          assert blob(raw) == '5fea86bcf734104c3416fbe58cde25da2d659690'
          entries = json.loads(gzip.decompress(raw))
          assert len(entries) == 3
          outputs = {}
          for entry in entries:
              path = Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert str(path).startswith(('src/main/kotlin/', 'src/test/java/')) or str(path) == 'build.gradle.kts'
              if entry['old'] is None:
                  assert not path.exists()
              else:
                  assert blob(path.read_bytes()) == entry['old'], path
              if 'content' in entry:
                  text = entry['content']
              else:
                  text = path.read_text()
                  for old, new in entry['replacements']:
                      assert text.count(old) == 1
                      text = text.replace(old, new)
              data = text.encode()
              assert blob(data) == entry['new'], path
              outputs[str(path)] = data
          for name, data in outputs.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          Path('audit-evidence').mkdir()
          Path('audit-evidence/source-manifest.json').write_text(json.dumps({name: blob(data) for name, data in outputs.items()}, indent=2))
          PY
          git diff --check
      - name: Publish the exact tested Legacy core API locally
        working-directory: .deps/Slimefun-Legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=ALBION-SNAPSHOT --console=plain --no-daemon
      - name: Preserve existing migration, transport and provider guards
        run: |
          set -euo pipefail
          python3 scripts/verify_legacy_migration.py
          python3 scripts/verify_doctor_bridge_safety.py
          python3 scripts/verify_mob_sim_drop_ranges.py
          python3 scripts/verify_mob_sim_input_filtering.py
          python3 scripts/verify_transport_contracts.py --slimefun .deps/Slimefun-Legacy --networks .deps/SF_NetworksExp
      - name: Reproduce the original silent target-metadata rejection
        id: original
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/main/kotlin/net/guizhanss/infinityexpansion2/core/migration/LegacyItemMigrator.kt
          cp "$FILE" "$RUNNER_TEMP/corrected-migrator.kt"
          trap 'cp "$RUNNER_TEMP/corrected-migrator.kt" "$FILE"' EXIT
          git show "HEAD:$FILE" > "$FILE"
          test "$(git hash-object "$FILE")" = d59737d077575edb9443d6f0dea1a539a4418ba2
          chmod +x gradlew
          set +e
          ./gradlew test --tests '*LegacyMetadataPreservationTest.rejectedMetadataApplicationIsReportedInsteadOfSilentSuccess' -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT --console=plain --no-daemon > audit-evidence/original.log 2>&1
          RESULT=$?
          set -e
          test "$RESULT" -ne 0
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path('build/test-results/test/TEST-net.guizhanss.infinityexpansion2.core.migration.LegacyMetadataPreservationTest.xml')
          suite = ET.parse(path).getroot()
          assert suite.get('tests') == '1' and suite.get('failures') == '1' and suite.get('skipped') == '0', suite.attrib
          assert 'nothing was thrown' in path.read_text()
          Path('audit-evidence/original.xml').write_bytes(path.read_bytes())
          print('Original copy boundary accepted rejected target metadata without reporting failure.')
          PY
      - name: Build corrected IE2 and run the actual metadata regression suite
        id: corrected
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ./gradlew clean build -PslimefunApiCoordinate=com.github.slimefun:Slimefun:ALBION-SNAPSHOT --console=plain --no-daemon 2>&1 | tee audit-evidence/corrected-build.log
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path('build/test-results/test/TEST-net.guizhanss.infinityexpansion2.core.migration.LegacyMetadataPreservationTest.xml')
          suite = ET.parse(path).getroot()
          assert int(suite.get('tests', '0')) == 8, suite.attrib
          assert all(int(suite.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped')), suite.attrib
          Path('audit-evidence/results.json').write_text(json.dumps(suite.attrib, indent=2))
          print('Actual IE2 metadata tests:', suite.attrib)
          PY
          git diff --check
      - name: Preserve verified source objects without moving any branch
        if: ${{ success() && steps.original.outcome == 'success' && steps.corrected.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          manifest = json.loads(Path('audit-evidence/source-manifest.json').read_text())
          for name, expected in manifest.items():
              data = Path(name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == expected, name
              request = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              response = subprocess.run(['gh', 'api', '--method', 'POST', f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs", '--input', '-', '--jq', '.sha'], input=request, text=True, capture_output=True, check=True)
              assert response.stdout.strip() == expected
              target = Path('audit-evidence/tested-source', name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print('VALIDATED_SOURCE_BLOB', expected, name)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ie2-metadata-preservation-evidence
          retention-days: 14
          path: |
            audit-evidence/
            build/test-results/test/TEST-*.xml
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: SF_InfinityExpansion2.0.10-metadata-candidate.jar
          path: build/libs/SF_InfinityExpansion2.0.10.jar
          archive: false
          if-no-files-found: error
